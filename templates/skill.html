{% extends 'base.html' %}
{% load static %}
{% block content %}
    <main>
        <!-- Skill section -->
        <section class="skill" id="skill">
            <div class="container skill-grid">
                <div class="skill-identity">
                    <p class="skill-kicker">What I Use</p>
                    <h1>My Skills</h1>
                </div>
                
                <div class="skill-content">
                    <ul class="skill-list">
                        {% for skill in skill_list %}
                            <li class="skill-item">
                                <img src="{% static 'img/skills/' %}{{ skill.icon }}" alt="{{ skill.name }}">
                                <span class="skill-name">
                                    <a href="{{ skill.url }}">{{ skill.name }}</a>
                                </span>
                            </li>
                        {% empty %}
                            <li class="empty-state">No skill added yet.</li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
