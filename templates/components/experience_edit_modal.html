<div id="edit-experience-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-experience-modal-title">

    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="edit-experience-modal"
            popovertargetaction="hide"
            aria-label="Close edit experience form"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="edit-experience-modal"
                popovertargetaction="hide"
                aria-label="Close edit experience form">
            ×
        </button>

        <h2 id="edit-experience-modal-title">Edit Experience</h2>

        <form id="edit-experience-form"
              method="post"
              class="project-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="edit-experience-title">Title</label>
                <input type="text"
                       name="title"
                       id="edit-experience-title"
                       required>
            </div>

            <div class="form-group">
                <label for="edit-experience-organization">Organization</label>
                <input type="text"
                       name="organization"
                       id="edit-experience-organization"
                       required>
            </div>

            <div class="form-group">
                <label for="edit-experience-description">Description</label>
                <textarea name="description"
                          id="edit-experience-description"
                          required></textarea>
            </div>

            <div class="form-group">
                <label for="edit-experience-category">Category</label>
                <select name="category"
                        id="edit-experience-category"
                        required>
                    <option value="internship">Internship</option>
                    <option value="research">Research</option>
                    <option value="volunteer">Volunteer</option>
                    <option value="part-time">Part-Time</option>
                    <option value="full-time">Full-Time</option>
                    <option value="freelance">Freelance</option>
                </select>
            </div>

            <div class="form-group">
                <label for="edit-experience-thumbnail">Thumbnail</label>
                <input type="url"
                       name="thumbnail"
                       id="edit-experience-thumbnail">
            </div>

            <div class="form-group">
                <label for="edit-experience-started-at">Started At</label>
                <input type="date"
                       name="started_at"
                       id="edit-experience-started-at"
                       required>
            </div>

            <div class="form-group">
                <label for="edit-experience-ended-at">Ended At</label>
                <input type="date"
                       name="ended_at"
                       id="edit-experience-ended-at">
            </div>

            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="edit-experience-modal"
                        popovertargetaction="hide">
                    Cancel
                </button>

                <button type="submit" class="button">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
