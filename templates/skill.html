{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project - {{ name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="/static/img/profile/rin-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/script.js" defer></script>
</head>

<body>

    <!-- Header and navigation -->
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ nickname }}</a>
            <button class="menu-toggle" aria-label="Toggle navigation">&#9776</button>
            <nav>
                <a href="{% url 'main:show_main' %}">Home</a>
                <a href="{% url 'main:show_main' %}#about">About</a>
                <a href="{% url 'main:show_skill' %}">Skill</a>
                <a href="{% url 'main:show_project' %}">Project</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
            </nav>
            <button class="theme-toggle" type="button" aria-label="Toggle dark mode">Dark</button>
        </div>
    </header>

    <main>

        <!-- Skill section -->
        <section class="skill" id="skill">
            <div class="container skill-grid">
                <div class="skill-identity">
                    <p class="skill-kicker">What I Use</p>
                    <h1>My Skills</h1>
                </div>
                
                <div class="skill-content">
                    <ul class="skill-list">
                        {% for skill in skill_list %}
                            <li class="skill-item">
                                <img src="{% static 'img/skills/' %}{{ skill.icon }}" alt="{{ skill.name }}">
                                <span class="skill-name">
                                    <a href="{{ skill.url }}">{{ skill.name }}</a>
                                </span>
                            </li>
                        {% empty %}
                            <li class="empty-state">No skill added yet.</li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>

</body>
</html>
