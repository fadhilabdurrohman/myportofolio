<div id="add-skill-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-skill-modal-title">

    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="add-skill-modal"
            popovertargetaction="hide"
            aria-label="Close add skill form"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="add-skill-modal"
                popovertargetaction="hide"
                aria-label="Close add skill form">
            ×
        </button>

        <h2 id="add-skill-modal-title">Add New Skill</h2>

        <form id="skill-form"
              method="post"
              action="{% url 'main:create_skill' %}"
              class="project-form">
            {% csrf_token %}

            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}

            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-skill-modal"
                        popovertargetaction="hide">
                    Cancel
                </button>

                <button type="submit" class="button">
                    Add Skill
                </button>
            </div>
        </form>
    </div>
</div>
