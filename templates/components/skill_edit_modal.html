<div id="edit-skill-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-skill-modal-title">

    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="edit-skill-modal"
            popovertargetaction="hide"
            aria-label="Close edit skill form"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="edit-skill-modal"
                popovertargetaction="hide"
                aria-label="Close edit skill form">
            ×
        </button>

        <h2 id="edit-skill-modal-title">Edit Skill</h2>

        <form id="edit-skill-form"
              method="post"
              class="project-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="edit-skill-name">Name</label>
                <input type="text"
                       name="name"
                       id="edit-skill-name"
                       required>
            </div>

            <div class="form-group">
                <label for="edit-skill-icon">Icon</label>
                <input type="text"
                       name="icon"
                       id="edit-skill-icon"
                       required>
            </div>

            <div class="form-group">
                <label for="edit-skill-url">URL</label>
                <input type="url"
                       name="url"
                       id="edit-skill-url">
            </div>

            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="edit-skill-modal"
                        popovertargetaction="hide">
                    Cancel
                </button>

                <button type="submit" class="button">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
