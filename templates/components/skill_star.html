<form method="post" action="{% url 'main:toggle_skill_star' skill.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="star-skill-button{% if user in skill.starred_by.all %} is-skill-starred{% endif %}"
            title="{% if skill.starred_by.all %}Starred by {{ skill.starred_by.all|join:', ' }}{% else %}Be the first to star{% endif %}">
        <span aria-hidden="true">★</span>
        <span class="skill-star-count">{{ skill.starred_by.count }}</span>
    </button>
</form>
